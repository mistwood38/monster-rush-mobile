<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071321"><meta name="description" content="驾驶星际战机，迎战无尽怪潮。"><title>怪潮突围 · Monster Rush</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
</head><body>
<main id="app"><canvas id="game" aria-label="怪潮突围游戏画面"></canvas>
<div id="hud" class="hidden"><div class="topline"><div class="stat"><span>✦ 得分</span><b id="score">0</b></div><div class="stat"><span>⏱ 生存</span><b id="time">00:00</b></div><button id="pause" class="icon-btn" aria-label="暂停">Ⅱ</button></div><div class="health"><span>装甲</span><div class="meter"><i id="hpbar"></i></div><b id="hptext">100</b></div><div class="weapon" id="weapon">脉冲单发 · Lv.1</div><div id="bossbar" class="boss hidden"><span id="bossname">灾厄巨像</span><div class="meter"><i id="bosshp"></i></div></div><div id="toast" class="toast"></div></div>
<section id="menu" class="panel"><div class="brand"><div class="logo">✦</div><p class="eyebrow">NEON FRONTIER · SURVIVAL</p><h1>怪潮<span>突围</span></h1><p class="subtitle">MONSTER RUSH</p></div><div class="hero-note">在无尽星尘中，杀出一条生路。</div><button id="start" class="primary">开始突围 <span>➜</span></button><div class="record">最高纪录 <b id="best">0</b></div><p class="hint">左右滑动移动战机 · 自动开火</p><button id="sound" class="sound">♫ 音效：开启</button></section>
<section id="pausePanel" class="panel hidden"><p class="eyebrow">暂 停</p><h2>整备时间</h2><button id="resume" class="primary">继续战斗</button><button id="restart" class="secondary">重新开始</button><button id="home" class="text-btn">返回主菜单</button></section>
<section id="endPanel" class="panel hidden"><p class="eyebrow">RUN COMPLETE</p><h2 id="endTitle">突围结束</h2><div class="result"><div><span>生存时间</span><b id="endTime">00:00</b></div><div><span>击败怪物</span><b id="kills">0</b></div><div><span>本局得分</span><b id="endScore">0</b></div><div><span>历史最高</span><b id="endBest">0</b></div></div><button id="again" class="primary">再来一局 <span>↻</span></button><button id="endHome" class="text-btn">返回主菜单</button></section>
<div id="rotate" class="rotate">请竖屏游玩</div></main><script src="./game.js" defer></script></body></html>
